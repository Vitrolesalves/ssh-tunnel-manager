# HAProxy na VPS: escuta 127.0.0.1:5433 (a porta que o Django ja usa) e reparte para
# os tuneis reversos reais em 5441 (principal), 5442 (secundario) e 5443 (terciario).
# Nada muda no sistema web: o banco continua sendo "localhost:5433".
#
# Teste de saude = pedido de SSL do Postgres (8 bytes) e espera 'S' ou 'N'. So abrir a
# porta NAO serve: um tunel morto aceita a conexao TCP e nunca responde (foi a queda
# de 16/11/2026).

global
    log /dev/log local0
    maxconn 2000
    user haproxy
    group haproxy
    daemon

defaults
    mode tcp
    log global
    option tcplog
    timeout connect 3s
    timeout client  1h
    timeout server  1h
    timeout check   4s

listen postgres_tunel
    bind 127.0.0.1:5433
    option tcp-check
    tcp-check connect
    tcp-check send-binary 0000000804d2162f
    tcp-check expect rstring ^[SN]
    default-server inter 3s fall 2 rise 2 on-marked-down shutdown-sessions
    server principal   127.0.0.1:5441 check
    server secundario  127.0.0.1:5442 check backup
    server terciario   127.0.0.1:5443 check backup
